[project]
name = "bolna-callqa"
version = "0.1.0"
description = "Call-quality signals and judge-vs-human agreement for Bolna voice agent executions (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
callqa = "callqa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
